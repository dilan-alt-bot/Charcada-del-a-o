<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Venta de entradas | La Charcada del Año</title>
	<link rel="stylesheet" href="../css/style.css">
	<script src="../js/compra-entradas.js" defer></script>
</head>
<body class="compra-page">
	<main class="compra-contenido">
		<header class="compra-hero">
			<a class="compra-volver" href="compra_entradas.html">← Volver a tus entradas</a>
			<p class="compra-etiqueta">La Charcada del Año · 2027</p>
			<h1>Pasarela de pago</h1>
			<p>Revisa tu selección y prueba el pago.</p>
		</header>

		<section id="pedido-no-disponible" class="compra-seccion" hidden>
			<h2>No hay una compra pendiente</h2>
			<p>Vuelve al formulario para elegir tus entradas.</p>
			<a class="boton-compra boton-enlace" href="compra_entradas.html">Elegir entradas <span aria-hidden="true">→</span></a>
		</section>

		<div id="contenido-venta" hidden>
			<section class="compra-seccion" aria-labelledby="pedido-titulo">
				<h2 id="pedido-titulo">Resumen de tu pedido</h2>
				<ul id="lista-pedido" class="lista-pedido"></ul>
				<p class="pedido-total"><strong>Total del pedido</strong><output id="total-pedido"></output></p>
			</section>

			<form id="formulario-pago" class="compra-seccion pasarela-simulada">
			
					<div class="campo-pago campo-pago-completo">
						<label for="numero-tarjeta">Número de tarjeta</label>
						<input id="numero-tarjeta" name="numero-tarjeta" type="text" inputmode="numeric" autocomplete="off" maxlength="19" pattern="[0-9 ]{13,19}" placeholder="0000 0000 0000 0000">
					</div>
					<div class="campo-pago">
						<label for="caducidad">Caducidad</label>
						<input id="caducidad" name="caducidad" type="month" autocomplete="off">
					</div>
					<div class="campo-pago">
						<label for="codigo-seguridad">Código de seguridad</label>
						<input id="codigo-seguridad" name="codigo-seguridad" type="password" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{3,4}" placeholder="000">
					</div>
					<div class="campo-pago campo-pago-completo">
						<label for="direccion-facturacion">Dirección de facturación</label>
						<input id="direccion-facturacion" name="direccion-facturacion" type="text" autocomplete="off" placeholder="Dirección de facturación">
					</div>
				</div>
				<p id="resultado-pago" class="resultado-pago" role="status" hidden></p>
				<button id="boton-pago" class="boton-compra" type="submit">Pago<span aria-hidden="true">→</span></button>
			</form>
		</div>
	</main>
</body>
</html>
